{% extends "base.html" %}
{% block title %}问得明白 · TokenTruth{% endblock %}

{% block content %}
<section class="max-w-5xl mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold text-slate-100">问得明白</h1>
  <p class="text-slate-400 text-sm">投资者直接提问，AI 根据项目资料给出带来源、时间、可信度、原文、风险的回答。</p>

  <div class="mt-4 flex items-center gap-3">
    <select id="projectSelect" class="bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm text-slate-200">
      {% for p in projects %}<option value="{{ p.projectId }}" {% if p.projectId == project_id %}selected{% endif %}>{{ p.name }} (${{ p.symbol }})</option>{% endfor %}
    </select>
    <label class="text-xs text-slate-400 flex items-center gap-1"><input id="anchorCheck" type="checkbox" class="accent-indigo-500"> 上链存证</label>
  </div>

  <div class="mt-4 bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
    <div class="flex gap-2">
      <input id="questionInput" type="text" placeholder="这家公司靠什么赚钱？" class="flex-1 bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button id="askBtn" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-sm">提问</button>
    </div>
    <div class="mt-3 flex flex-wrap gap-2 text-xs">
      <button class="suggestedBtn px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">这家公司靠什么赚钱？</button>
      <button class="suggestedBtn px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">我买的代币有什么权利？</button>
      <button class="suggestedBtn px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">什么时候可以转让？</button>
      <button class="suggestedBtn px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">未来一年有哪些解锁？</button>
      <button class="suggestedBtn px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">这个项目当前最大的风险是什么？</button>
    </div>
  </div>

  <div id="answerArea" class="mt-4 space-y-3"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/chat.js"></script>
{% endblock %}
