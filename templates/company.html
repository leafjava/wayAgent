{% extends "base.html" %}
{% block title %}项目方后台 · TokenTruth{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold text-slate-100">项目方后台</h1>
  <p class="text-slate-400 text-sm">把公司资料、产品文件统一为可维护的 AI 知识库，辅助生成介绍材料、视频脚本、新闻内容、FAQ。</p>

  <div class="mt-4 flex items-center gap-3">
    <select id="projectSelect" class="bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm text-slate-200">
      {% for p in projects %}<option value="{{ p.projectId }}" {% if p.projectId == project_id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
    </select>
    <a id="editLink" href="/edit_doc?projectId={{ project_id }}&docType=whitepaper" class="text-xs text-indigo-300 hover:text-indigo-200">编辑资料 →</a>
  </div>

  <div class="mt-4 grid md:grid-cols-2 gap-4">
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <h3 class="text-sm font-semibold text-slate-100">内容模板</h3>
      <div class="mt-3 space-y-1 text-xs" id="templateList">
        {% for t in templates %}
        <button data-template="{{ t.key }}" class="templateBtn w-full text-left px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-200">
          <span class="font-semibold">{{ t.title }}</span>
          <span class="text-slate-500 ml-2">{{ t.structure|length }} 段</span>
        </button>
        {% endfor %}
      </div>
    </div>

    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <h3 class="text-sm font-semibold text-slate-100">生成结果</h3>
      <div id="contentResult" class="mt-3 text-xs text-slate-400">
        <p class="text-slate-500">点击左侧模板开始生成</p>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/company.js"></script>
{% endblock %}
