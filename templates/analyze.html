{% extends "base.html" %}
{% block title %}帮我分析 · TokenTruth{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold text-slate-100">帮我分析</h1>
  <p class="text-slate-400 text-sm">整理公司基本面、新闻、市场数据、社区信息，解释变化和风险。</p>

  <div class="mt-4 flex items-center gap-3">
    <select id="projectSelect" class="bg-slate-800 border border-slate-700 rounded px-2 py-1.5 text-sm text-slate-200">
      {% for p in projects %}<option value="{{ p.projectId }}" {% if p.projectId == project_id %}selected{% endif %}>{{ p.name }} (${{ p.symbol }})</option>{% endfor %}
    </select>
    <button id="analyzeBtn" class="px-4 py-1.5 rounded bg-purple-600 hover:bg-purple-500 text-white text-sm">分析</button>
    <button id="riskBtn" class="px-4 py-1.5 rounded bg-amber-600 hover:bg-amber-500 text-white text-sm">重新评估风险</button>
  </div>

  <div id="summary" class="mt-4 text-slate-300 text-sm"></div>

  <div class="mt-4 grid md:grid-cols-3 gap-4">
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <h3 class="text-sm font-semibold text-slate-100"><i class="fa fa-building text-indigo-300"></i> 基本面</h3>
      <div id="fundamentals" class="mt-3 text-xs text-slate-400 space-y-2"></div>
    </div>
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <h3 class="text-sm font-semibold text-slate-100"><i class="fa fa-line-chart text-purple-300"></i> 市场与社区</h3>
      <div id="market" class="mt-3 text-xs text-slate-400 space-y-2"></div>
    </div>
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <h3 class="text-sm font-semibold text-slate-100"><i class="fa fa-warning text-amber-300"></i> 风险因素</h3>
      <div id="risk" class="mt-3 text-xs space-y-2"></div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/analyze.js"></script>
{% endblock %}
